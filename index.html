<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Map</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MAP -->
    <div id="map"></div>


    <!-- SEARCH -->
    <div class="search-container">

        <div class="search-box">

            <span class="search-icon">⌕</span>

            <input
                id="searchInput"
                type="text"
                placeholder="Cari lokasi atau tempat..."
                autocomplete="off"
            >

            <button
                id="clearSearch"
                class="clear-search"
                type="button"
            >
                ×
            </button>

        </div>

    </div>


    <!-- GPS STATUS -->
    <div
        id="gpsStatus"
        class="gps-status"
    >

        <span
            id="gpsDot"
            class="gps-dot"
        ></span>

        <span id="gpsText">
            GPS belum aktif
        </span>

    </div>


    <!-- MAP BUTTONS -->
    <div class="map-controls">

        <button
            id="gpsButton"
            class="map-button"
            title="Lokasi saya"
        >
            <span>⌾</span>
        </button>


        <button
            id="addButton"
            class="map-button add-button"
            title="Tambah titik"
        >
            +
        </button>

    </div>


    <!-- ADD POINT PANEL -->
    <div
        id="pointPanel"
        class="point-panel hidden"
    >

        <div class="panel-header">

            <div>
                <h2>Tambah Titik</h2>

                <p>
                    Klik peta atau pilih hasil pencarian
                </p>
            </div>

            <button
                id="closePanel"
                class="close-button"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label>
                Nama lokasi
            </label>

            <input
                id="pointName"
                type="text"
                placeholder="Contoh: Titik Driver A"
            >

        </div>


        <div class="coordinate-row">

            <div class="form-group">

                <label>
                    Latitude
                </label>

                <input
                    id="pointLat"
                    type="text"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>
                    Longitude
                </label>

                <input
                    id="pointLng"
                    type="text"
                    readonly
                >

            </div>

        </div>


        <div class="form-group">

            <label>
                Status
            </label>

            <select id="pointStatus">

                <option value="Fiktif">
                    Fiktif
                </option>

                <option value="Asli">
                    Asli
                </option>

                <option value="Survey">
                    Survey
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Keterangan
            </label>

            <textarea
                id="pointDescription"
                placeholder="Masukkan keterangan lokasi..."
            ></textarea>

        </div>


        <button
            id="savePoint"
            class="save-button"
            type="button"
        >
            Simpan Titik
        </button>

    </div>


    <!--
        script.js harus dimuat SEBELUM Google Maps.
        Karena initMap dibuat di script.js.
    -->

    <script src="script.js"></script>


    <!-- GOOGLE MAPS -->
    <script
        async
        defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAjNVDmAvtF2iXae3Krb4dD603FbBt6UP8&libraries=places&callback=initMap">
    </script>

</body>
</html>
