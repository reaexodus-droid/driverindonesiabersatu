<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Driver Maps</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="map"></div>

<!-- SEARCH -->
<div class="search-container">

    <div class="search-box">

        <span class="search-icon">⌕</span>

        <input
            id="searchInput"
            type="search"
            placeholder="Cari lokasi, alamat, tempat..."
            autocomplete="off"
        >

        <button id="clearSearch" class="clear-btn">×</button>

    </div>

    <div id="searchResults" class="search-results"></div>

</div>


<!-- GPS STATUS -->
<div id="gpsStatus" class="gps-status">
    <span id="gpsDot"></span>
    <span id="gpsText">GPS belum aktif</span>
</div>


<!-- MAP BUTTONS -->
<div class="map-buttons">

    <button id="gpsButton" class="map-button" title="Lokasi saya">
        ◎
    </button>

    <button id="addButton" class="map-button add-button" title="Tambah titik">
        +
    </button>

</div>


<!-- PLACE INFO -->
<div id="placeCard" class="place-card hidden">

    <button id="closePlace" class="close-button">
        ×
    </button>

    <div id="placeName" class="place-name">
        -
    </div>

    <div id="placeAddress" class="place-address">
        -
    </div>

    <div id="placeCoordinates" class="coordinates">
        -
    </div>

    <button id="destinationButton" class="primary-button">
        Jadikan Tujuan
    </button>

    <button id="saveLocationButton" class="secondary-button">
        Simpan Titik
    </button>

</div>


<!-- ADD POINT -->
<div id="pointPanel" class="point-panel hidden">

    <div class="panel-header">

        <strong>Tambah Titik</strong>

        <button id="closePanel" class="close-button">
            ×
        </button>

    </div>

    <p class="hint">
        Klik pada peta untuk menentukan koordinat.
    </p>

    <label>Nama</label>

    <input
        id="pointName"
        type="text"
        placeholder="Nama lokasi"
    >

    <label>Latitude</label>

    <input
        id="pointLat"
        type="text"
        readonly
    >

    <label>Longitude</label>

    <input
        id="pointLng"
        type="text"
        readonly
    >

    <label>Status</label>

    <select id="pointStatus">

        <option value="Fiktif">
            Fiktif
        </option>

        <option value="Asli">
            Asli
        </option>

        <option value="Survey">
            Survey
        </option>

    </select>

    <label>Keterangan</label>

    <textarea
        id="pointDescription"
        placeholder="Keterangan lokasi..."
    ></textarea>

    <button id="savePoint" class="primary-button">
        Simpan Titik
    </button>

</div>


<!-- ROUTE INFO -->
<div id="routeCard" class="route-card hidden">

    <button id="closeRoute" class="close-button">
        ×
    </button>

    <div class="route-title">
        Rute
    </div>

    <div id="routeDistance" class="route-distance">
        -
    </div>

    <div id="routeTime" class="route-time">
        -
    </div>

</div>


<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<script src="script.js"></script>

</body>
</html>
